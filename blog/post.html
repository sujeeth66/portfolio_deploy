<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post · G. Sujeeth Madhav</title>
<link rel="stylesheet" href="../assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <a class="brand" href="../index.html">SUJEETH<span>.</span>MADHAV</a>
  <nav>
    <a href="../index.html">Home</a>
    <a href="../projects.html">Projects</a>
    <a href="../3d-work.html">3D Work</a>
    <a href="index.html">Blog</a>
    <a href="../resume.html">Resume</a>
  </nav>
</header>
<main>
  <p class="noprint"><a href="index.html">← All posts</a></p>
  <article class="prose" id="post"><p class="muted">Loading…</p></article>
</main>
<footer><span>© <span id="year">2026</span> G. Sujeeth Madhav</span><span></span></footer>
<script src="../assets/site.js"></script>
<script type="module">
  // Looks for the post in posts/ (the repo) first, then in the database.
  import { fetchPost, displayDate } from '../assets/portfolio.js';
  import { renderMarkdown, esc } from '../assets/content.js';

  const el = document.getElementById('post');
  const slug = new URLSearchParams(location.search).get('slug');

  async function fromRepo() {
    const index = await fetch('posts/index.json').then(r => r.json());
    const info = index.find(p => p.slug === slug);
    if (!info) return null;
    const res = await fetch(`posts/${slug}.md`);
    if (!res.ok) return null;
    return { title: info.title, date: info.date, html: renderMarkdown(await res.text()) };
  }

  async function fromDatabase() {
    const p = await fetchPost(slug);
    if (!p) return null;
    const cover = p.cover_url ? `<img class="cover" src="${esc(p.cover_url)}" alt="">` : '';
    return { title: p.title, date: p.post_date, html: cover + renderMarkdown(p.body) };
  }

  function notFound() {
    el.innerHTML = '<p>Post not found.</p>';
  }

  if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
    notFound();
  } else {
    let found = null;
    try { found = await fromRepo(); } catch {}
    if (!found) { try { found = await fromDatabase(); } catch {} }
    if (!found) notFound();
    else {
      document.title = `${found.title} · G. Sujeeth Madhav`;
      el.innerHTML = `<div class="tag-line">${esc(displayDate(found.date))}</div><h1>${esc(found.title)}</h1>${found.html}`;
    }
  }
</script>
</body>
</html>
