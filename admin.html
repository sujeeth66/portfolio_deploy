<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin · G. Sujeeth Madhav</title>
<link rel="stylesheet" href="assets/style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .admin { max-width: 1100px; }
  .admin button, .admin .btn {
    background: var(--accent); color: #111; border: 0; padding: 9px 14px; cursor: pointer;
    font-family: var(--mono); font-size: 13px;
  }
  .admin button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .admin button.danger { background: #3a1d1d; color: #ffb4b4; border: 1px solid #5a2b2b; }
  .admin button:disabled { opacity: .5; cursor: default; }
  .admin button.active { border: 1px solid var(--accent); }
  .admin input, .admin textarea, .admin select {
    width: 100%; background: #0a0b0d; color: var(--text); border: 1px solid var(--line);
    padding: 9px 10px; margin-top: 4px; font: inherit;
  }
  .admin label { display: block; font-family: var(--mono); font-size: 12px; color: var(--dim); margin-bottom: 12px; }
  .admin label.checkbox { display: flex; gap: 8px; align-items: center; }
  .admin label.checkbox input { width: auto; margin: 0; }
  .admin textarea { min-height: 80px; resize: vertical; }
  .admin .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .admin .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .admin .preview { border: 1px solid var(--line); padding: 12px; min-height: 200px; background: var(--panel); overflow-wrap: anywhere; font-size: 15px; }
  .admin .panel { border: 1px solid var(--line); background: var(--panel); padding: 22px; max-width: 520px; }
  .admin .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    border: 1px solid var(--line); background: var(--panel); padding: 14px 16px; margin-bottom: 10px; }
  .admin .row-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .admin .tabs { display: flex; gap: 8px; }
  .admin .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
  .admin .error { color: #ff8a8a; font-family: var(--mono); font-size: 13px; }
  .admin .ok { color: var(--ok); font-family: var(--mono); font-size: 13px; }
  @media (max-width: 760px) {
    .admin .grid2, .admin .body-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
